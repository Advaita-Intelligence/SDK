<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Acai Proxy Server Test</title>
  </head>
  <body>
    <h1>🚀 Acai Proxy Server Test</h1>
    <p>
      This page is used to test the proxy server.
      Run the proxy server with the command 'pnpm proxy:dev' in the root of this repo
    </p>
    <p>Open your console and run test events to see that it works</p>

    <script type="module">
      import * as acai from '@acai/analytics-browser';
      import { stubPlugin } from '@acai/plugin-stub-browser';
      
      // Make acai available globally for debugging
      window.acai = acai;
      
      // Configuration
      const PROXY_SERVER_URL = 'http://localhost:3001/2/httpapi';
      const API_KEY = import.meta.env.VITE_ACAI_API_KEY || 'test-api-key';
      const USER_ID = import.meta.env.VITE_ACAI_USER_ID || 'proxy-test-user-' + Date.now();
      
      // Initialize Acai with proxy server
      acai.add(stubPlugin());
      acai.init(API_KEY, USER_ID, {
        serverUrl: PROXY_SERVER_URL,
        serverZone: 'US',
        logLevel: 1, // Debug level
        trackingSessionEvents: true,
        trackingPlan: {
          version: '1',
          rules: []
        }
      });
    </script>
  </body>
</html>
